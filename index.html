stic-bag test: run a thin bag over the paint; if it drags or feels gritty the car needs claying. With the car washed and fully dry, spray clay lubricant generously on a small section (about 2 ft by 2 ft), glide the clay back and forth with light pressure, fold it to a clean face every 2 to 3 sections, and wipe each section dry at once. Re-rinse and repeat the bag test: the paint should feel glass-smooth. About 100 ml of lubricant is used per car; one clay bar lasts 15 to 20 cars.", "prods": [["P11", 1.0], ["P42", 100.0], ["P24", 2.0]], "mins": 40.0, "vq": false, "conf": "High", "eff": "Medium", "lasts": "Until next contamination", "cautions": "Throw away any clay that is dropped. Working dry or under-lubricated marrs the paint; re-polish that section.", "basis": "Your Pre-Listing Guide (D2)"}, {"id": "S06", "name": "Water-spot removal (fresh to moderate spots)", "per": "per panel", "fixes": "Hard-water spots and mineral rings that sit on the surface.", "how": "On a cool panel spray about 5 ml water-spot remover diluted 1:1 with water onto a clean microfibre. Wipe the spotted area within 1 minute, rinse and dry. Repeat once if needed and protect the panel afterwards.", "prods": [["P28", 5.0], ["P24", 1.0]], "mins": 10.0, "vq": false, "conf": "High", "eff": "Low", "lasts": "Until next wetting", "cautions": "Never let acid dry on paint; rinse fully.", "basis": "Your cost analysis (water-spot remover) plus my estimate"}, {"id": "S07", "name": "Machine polish, light defects (finishing pass)", "per": "per panel", "fixes": "Swirl marks, light scratches, holograms, dull gloss, scuffs, paint transfer, polish haze.", "how": "Use a dual-action polisher, never a rotary. Wash and clay the panel and mask trim and badges. Check under an LED raking light first. Use a clean finishing pad (white at speed 2 to 3, black at speed 1 to 2 for the final pass) with about 4 ml finishing polish; spread at speed 1 to 2, then work slow overlapping passes. Wipe with 5 ml IPA solution and inspect const byPart={};D.issues.forEach(i=>(byPart[i.part_id]=byPart[i.part_id]||[]).push(i));
const cl=D.issues.filter(i=>i.fix!=="Refurb boundary"),qwN=D.issues.filter(i=>i.qw).length;
function go(t){S.tab=t;S.part=null;$("dr").classList.remove("open");draw()}
function set(k,v){S[k]=v;draw()}
function sc(f){S.scope.has(f)?S.scope.delete(f):S.scope.add(f);draw()}
function reset(){S.q=S.pri=S.eff=S.conf="";S.qw=false;S.scope=new Set(["Clean","Detail / restore"]);draw()}
function view(p,e,q){S.tab="Parts";S.part=null;S.pri=p||"";S.eff=e||"";S.qw=!!q;draw()}
function bar(){const o=(k,a)=>a.map(x=>`<option value="${x}" ${S[k]===x?"selected":""}>${x||"Any"}</option>`).join("");
return`<div class="bar"><div class="seg">${["Exterior","Interior","Whole car"].map(z=>`<button class="${S.zone===z?"on":""}" onclick="S.part=null;set('zone','${z}')">${z}</button>`).join("")}</div>
<div class="seg">${["Clean","Detail / restore","Refurb boundary"].map(f=>`<button class="${S.scope.has(f)?"on":""}" onclick="sc('${f}')">${f}</button>`).join("")}</div>
<input type="search" placeholder="Search a symptom, e.g. smoke smell" value="${S.q}" oninput="S.q=this.value.toLowerCase();clearTimeout(window.t);window.t=setTimeout(draw,250)" id="q">
<label>Priority <select onchange="set('pri',this.value)">${o("pri",["","High","Medium","Low"])}</select></label>
<label>Effort <select onchange="set('eff',this.value)">${o("eff",["","Low","Medium","High"])}</select></label>
<label>Confidence <select onchange="set('conf',this.value)">${o("conf",["","High","Medium","Low"])}</select></label>
<label><input type="checkbox" ${S.qw?"checked":""} onchange="set('qw',this.checked)"> Quick wins only</label>
<button class="btn" onclick="reset()">Reset</button></div>`}
function costBar(){return`<div class="bar" style="margin-top:-6px"><span>Cost basis</span><div class="seg">${["In-house","Branded"].map(b=>`<button class="${S.basis===b?"on":""}" onclick="set('basis','${b}')">${b}</button>`).join("")}</div><label>Labour ₹/min <input type="number" step="0.5" min="0" value="${S.rate}" onchange="set('rate',+this.value||0)"></label></div>`}
function overview(){const c=a=>cl.filter(i=>i.pri===a[0]&&i.eff===a[1]).length,P=["High","Medium","Low"],E=["Low","Medium","High"];
const g={};cl.filter(i=>i.qw).forEach(i=>g[i.group]=(g[i.group]||0)+1);const r=Object.entries(g).sort((a,b)=>b[1]-a[1]);
return`<div class="kpi">${[[N(D.issues.length),"issues across "+D.parts.length+" parts",()=>view()],[N(cl.length),"fixable by cleaning or detailing",()=>view()],[N(qwN),"quick wins: high priority, high confidence, low effort","view('','',1)"],[N(D.issues.length-cl.length),"need refurb, outside cleaning scope","go('Parts')"],[N(D.sols.length),"solutions in the library","go('Solutions')"]].map((x,i)=>`<button class="k" onclick="${typeof x[2]==="string"?x[2]:"view()"}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join("")}</div>
<h2>Priority against effort, cleaning and detailing issues (${N(cl.length)})</h2><p>Click a cell to list its issues. Top-left is where to start.</p>
<table style="max-width:640px"><tr><th>Priority \\ Effort</th>${E.map(e=>`<th class="c">${e} effort</th>`).join("")}</tr>${P.map(p=>`<tr><th>${p} priority</th>${E.map(e=>`<td class="m"><button onclick="view('${p}','${e}')" style="background:${p==="High"&&e==="Low"?"#CFE6EC":"none"}">${c([p,e])}</button></td>`).join("")}</tr>`).join("")}</table>
<h2>Where the quick wins are</h2><table style="max-width:640px"><tr><th>Area</th><th>Quick wins</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</table>
<p class="src">Source: Car Perceived-Quality Issue Handbook (updated workbook). Priority is provisional, based on when a buyer first notices an issue. See Method.</p>`}
function parts(){if(S.part)return partView();
if(filt())return bar()+results(D.issues.filter(ok),"Matching issues");
const ps=D.parts.filter(p=>p.zone===S.zone),gs=[...new Set(ps.map(p=>p.group))];
return bar()+gs.map(g=>`<h2>${g}</h2><div class="grid">${ps.filter(p=>p.group===g).map(p=>{const a=byPart[p.id],v=a.filter(ok),c=f=>100*a.filter(i=>i.fix===f).length/a.length;
return`<button class="tile" onclick="S.part='${p.id}';draw()"><b>${p.name}</b><div class="stack"><i style="width:${c("Clean")}%;background:#2E7D4F"></i><i style="width:${c("Detail / restore")}%;background:#B7791F"></i><i style="width:${c("Refurb boundary")}%;background:#9AA7B2"></i></div><small>${v.length} shown of ${a.length} · ${v.filter(i=>i.qw).length} quick wins · ${v.filter(i=>i.pri==="High").length} high priority</small></button>`}).join("")}</div>`).join("")+`<p class="src">Bars: green clean, amber detail/restore, grey refurb.</p>`}
function results(a,t){return`<h2>${t} (${N(a.length)})</h2>${a.length?table(a.slice(0,150),true)+(a.length>150?`<p class="src">Showing the first 150. Narrow the filters to see the rest.</p>`:""):`<div class="note">No issues match these filters. Press Reset.</div>`}`}
function table(a,sp){return`<table><tr><th></th><th>Issue</th>${sp?"<th>Part</th>":""}<th>Priority</th><th>Effort</th><th>Confidence</th><th>Cost</th><th>Solution</th></tr>${a.map(i=>{const s=SO[i.sid];return`<tr class="row" onclick="openI('${i.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" ${S.plan.has(i.id)?"checked":""} onchange="tp('${i.id}')" aria-label="Add to prep plan"></td><td>${i.issue}${i.qw?' <span class="chip pH">Quick win</span>':""}<br><small style="color:var(--mut)">${i.id} · ${i.cat} · ${i.fix}</small></td>${sp?`<td>${i.part}</td>`:""}<td>${pc(i.pri)}</td><td>${ec(i.eff)}</td><td>${cc(i.conf)}</td><td>${rs(cost(s).tot)}<br><small style="color:var(--mut)">${s.per}</small></td><td>${s.name}</td></tr>`}).join("")}</table>`}
function partView(){const p=D.parts.find(x=>x.id===S.part),a=byPart[p.id],f=k=>a.filter(i=>i.fix===k).length;
return`<div class="crumb"><a onclick="S.part=null;draw()">All parts</a> / ${p.group}</div><h1 class="title">${p.name}: ${a.length} issues, ${f("Clean")} fixable by cleaning, ${f("Detail / restore")} need detailing, ${f("Refurb boundary")} need refurb</h1>${bar()}${costBar()}<p class="src" style="margin:-6px 0 12px">Reach to this part: ${p.reach}. Tick issues to build a prep plan.</p>${results(a.filter(ok),"Issues")}`}
function steps(t){return t.split(/(?<=[a-z0-9\)])\.\s+(?=[A-Z])/).map(x=>`<li>${x.replace(/\.$/,"")}.</li>`).join("")}
function openI(id){const i=D.issues.find(x=>x.id===id),s=SO[i.sid],c=cost(s),d=$("dr");
d.innerHTML=`<button class="x" onclick="$('dr').classList.remove('open')" aria-label="Close">×</button><div class="crumb">${i.id} · ${i.part}</div><h2 style="margin:0 0 8px;font-size:18px">${i.issue}</h2>
<p>${pc(i.pri)} priority · ${i.fix} · ${i.cat} · first noticed at ${i.noticed.toLowerCase()}${i.qw?' · <span class="chip pH">Quick win</span>':""}</p><h3>Why it happens</h3><p>${i.why}</p><p><b>Reversibility:</b> ${i.rev}</p>
<h2 style="font-size:16px">${s.name}</h2><p>${s.fixes}</p><p>${ec(s.eff)} effort · ${cc(s.conf)} confidence of getting close to new · lasts: ${s.lasts}</p>
<h3>How to do it</h3><ol>${steps(s.how)}</ol>
<h3>Cost per application (${s.per}), ${S.basis.toLowerCase()} basis</h3><table><tr><th>Item</th><th>Qty</th><th>Cost</th></tr>${c.lines.map(l=>`<tr><td>${l.n}</td><td>${l.q} ${l.u}</td><td>${s.vq?"-":rs(l.a)}</td></tr>`).join("")}<tr><td>Labour</td><td>${s.mins} min</td><td>${s.vq?"-":rs(c.lab)}</td></tr><tr><th>Total</th><th></th><th>${rs(c.tot)}</th></tr></table>${s.vq?'<div class="note">Outside specialist work. Get a quote; no cost is assumed.</div>':""}
${s.cautions?`<div class="note"><b>Cautions:</b> ${s.cautions}</div>`:""}<p class="src">Quantities based on: ${s.basis||"assumption"}</p>
<p><button class="btn" onclick="tp('${i.id}');openI('${i.id}')">${S.plan.has(i.id)?"Remove from prep plan":"Add to prep plan"}</button></p>`;d.classList.add("open")}
function tp(id){S.plan.has(id)?S.plan.delete(id):S.plan.add(id);const c=$("pcn");if(c)c.textContent=S.plan.size}
function plan(){const a=D.issues.filter(i=>S.plan.has(i.id));if(!a.length)return`<h2>Prep plan</h2><div class="note">Nothing selected. Open a part, tick the issues found on the car, and the plan builds here.</div>${costBar()}`;
const g={};a.forEach(i=>(g[i.sid]=g[i.sid]||[]).push(i));const R={High:0,Medium:1,Low:2};
const rows=Object.entries(g).map(([id,v])=>{const s=SO[id],k=s.per==="per car"?1:v.length,c=cost(s);return{s,v,k,min:s.mins*k,tot:c.tot==null?null:c.tot*k,qw:v.some(i=>i.qw),p:Math.min(...v.map(i=>R[i.pri]))}}).sort((a,b)=>b.qw-a.qw||a.p-b.p||(a.tot??1e9)-(b.tot??1e9));
const known=rows.filter(r=>r.tot!=null),vq=rows.filter(r=>r.tot==null).length;
return`<h2>Prep plan: ${a.length} issues, ${rows.length} treatments</h2>${costBar()}<p>Quick wins first, then by priority. “Per car” treatments are counted once however many issues use them; other units are counted once per issue.</p>
<table><tr><th>Treatment</th><th>Issues it covers</th><th>Times</th><th>Minutes</th><th>Cost</th></tr>${rows.map(r=>`<tr><td>${r.s.name}${r.qw?' <span class="chip pH">Quick win</span>':""}<br><small style="color:var(--mut)">${r.s.per} · ${r.s.eff} effort</small></td><td>${r.v.map(i=>i.part+": "+i.issue).join("<br>")}</td><td>${r.k}</td><td>${r.min}</td><td>${rs(r.tot)}</td></tr>`).join("")}
<tr><th>Total (excluding quotes)</th><th></th><th></th><th>${known.reduce((t,r)=>t+r.min,0)}</th><th>${rs(known.reduce((t,r)=>t+r.tot,0))}</th></tr></table>${vq?`<p class="src">${vq} treatment(s) need an outside quote and are not in the total.</p>`:""}
<p><button class="btn" onclick="window.print()">Print plan</button> <button class="btn" onclick="S.plan.clear();draw()">Clear</button></p>`}
function lib(){const c={};D.issues.forEach(i=>c[i.sid]=(c[i.sid]||0)+1);
return`<h2>Solution library (${D.sols.length})</h2>${costBar()}<table><tr><th>Solution</th><th>Applies per</th><th>Effort</th><th>Confidence</th><th>Minutes</th><th>Cost</th><th>Issues using it</th></tr>${D.sols.map(s=>`<tr><td>${s.name}</td><td>${s.per}</td><td>${ec(s.eff)}</td><td>${cc(s.conf)}</td><td>${s.mins}</td><td>${rs(cost(s).tot)}</td><td>${c[s.id]||0}</td></tr>`).join("")}</table>`}
function method(){return`<h2>Method and assumptions</h2><div class="note"><b>Status: first draft.</b> Issues, causes and solutions were written from general knowledge of detailing and used-car inspection, not from your inventory, sales or buyer data.</div>
<h3>Priority (provisional)</h3><p>Listing photo and Walkaround are High, Sit-in and Test drive are Medium, Close inspection is Low. Replace it with severity and buyer-importance data when you have it.</p>
<h3>Quick win</h3><p>High priority, High confidence and Low effort.</p>
<h3>Confidence and effort</h3><p>Confidence is how sure we are that the solution gets the car close to new. Effort is how much price and technique it needs (Low is cheap and simple, High is costly or skilled).</p>
<h3>Cost</h3><p>Material cost is quantity times unit price from the Products sheet. In-house uses your cost analysis (mid prices plus ₹8 per litre packaging) where a formula exists, otherwise the bought price, which is an assumption. Labour is minutes times the rate (₹${D.rate} per minute by default); minutes are estimates, not timed. Outside specialist work shows “Vendor quote” and is left out of totals.</p>
<h3>Prep plan</h3><p>Treatments are grouped so that “per car” work is counted once. Other units (per panel, per spot, per seat) are counted once per ticked issue, which may overstate a car where one panel has several issues.</p>
<h3>Reach</h3><p>How hard a part is to physically get at (Easy, Moderate, Hard). This is my judgement, not from the workbook.</p>
<h3>Next steps</h3><p>Time each solution with a stopwatch, replace estimated prices with supplier quotes, and validate priority against buyer feedback and days-to-sell on a pilot batch.</p>`}
const TABS=["Overview","Parts","Prep plan","Solutions","Method"];
function draw(){$("nav").innerHTML=TABS.map(t=>`<button class="${S.tab===t?"on":""}" onclick="go('${t}')">${t}${t==="Prep plan"?` (<span id="pcn">${S.plan.size}</span>)`:""}</button>`).join("");
$("m").innerHTML=({Overview:overview,Parts:parts,"Prep plan":plan,Solutions:lib,Method:method})[S.tab]();
if(S.q&&S.tab==="Parts"){const q=$("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("dr").classList.remove("open")});
draw();
</script></body></html>
